<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SanMin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #6aaa64; --dark-teal: #1b4f5c; }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #f0f7f4 0%, #ffffff 50%, #e0f2f1 100%);
            overflow: hidden;
        }
        .shape { position: absolute; filter: blur(80px); z-index: -1; border-radius: 50%; }
        .shape-1 { width: 400px; height: 400px; background: rgba(106, 170, 100, 0.2); top: -100px; left: -100px; }
        .shape-2 { width: 300px; height: 300px; background: rgba(27, 79, 92, 0.15); bottom: -50px; right: -50px; }
        .login-card {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(27, 79, 92, 0.1); width: 350px; text-align: center;
        }
        .logo { width: 120px; margin-bottom: 20px; }
        h2 { color: var(--dark-teal); margin-bottom: 30px; }
        .input-box { text-align: left; margin-bottom: 20px; }
        label { font-size: 0.85rem; color: var(--dark-teal); font-weight: 600; }
        input {
            width: 100%; padding: 12px; margin-top: 5px; border: 1px solid rgba(106, 170, 100, 0.3);
            border-radius: 12px; background: rgba(255, 255, 255, 0.8); box-sizing: border-box; outline: none;
        }
        .btn-login {
            width: 100%; padding: 15px; background: linear-gradient(to right, var(--dark-teal), var(--primary-green));
            color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-login:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(27, 79, 92, 0.3); }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="login-card">
        <img src="LogSanMin.png" alt="Logo" class="logo">
        <h2>Acceso Admin</h2>
        <form id="loginForm">
            <div class="input-box">
                <label>Usuario</label>
                <input type="text" id="userInput" placeholder="admin@sanmin.com" required>
            </div>
            <div class="input-box">
                <label>Contraseña</label>
                <input type="password" id="passInput" placeholder="••••" required>
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            // Validación simple
            if(user === "admin" && pass === "1234") {
                window.location.href = "panel_admin.html";
            } else {
                alert("Datos incorrectos. Intente con admin / 1234");
            }
        });
    </script>
</body>
</html>
